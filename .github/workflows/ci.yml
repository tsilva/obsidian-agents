name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

jobs:
  test:
    name: JavaScript security and plugin gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Test dependency boundaries
        run: pnpm test

      - name: Build production plugin
        run: pnpm build

      - name: Smoke-test built plugin
        run: |
          test -s main.js
          grep -Fq "Open with agent" main.js
          grep -Fq "osascript" main.js
